name: KALYNO Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      

      - name: Tests unitaires (bloquants si erreur)
        continue-on-error: false
        run: gradle testDebugUnitTest

      - name: Prepare release keystore
        run: echo "${{ secrets.KALYNO_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/kalyno-release.jks"

      - name: Compile KALYNO 
        env:
          KALYNO_KEYSTORE_PATH: ${{ runner.temp }}/kalyno-release.jks
          KALYNO_KEYSTORE_PASSWORD: ${{ secrets.KALYNO_KEYSTORE_PASSWORD }}
          KALYNO_KEY_ALIAS: ${{ secrets.KALYNO_KEY_ALIAS }}
          KALYNO_KEY_PASSWORD: ${{ secrets.KALYNO_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Verify release signature
        run: $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: KALYNO
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
