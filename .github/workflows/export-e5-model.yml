name: Exporter le modèle E5

# À lancer UNE fois à la main (Actions > Exporter le modèle E5 > Run workflow).
# Génère le modèle int8 + son vocabulaire, retire l'ancien moteur MiniLM et pousse le tout sur main.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Installer les dépendances d'export
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
          pip install "optimum[onnxruntime]" onnx onnxruntime sentencepiece transformers numpy

      - name: Exporter multilingual-e5-small
        run: python tools/export_e5.py

      - name: Retirer l'ancien moteur et publier le nouveau
        run: |
          git rm -f --ignore-unmatch app/src/main/assets/semantic/model_int8.onnx app/src/main/assets/semantic/vocab.tsv
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add app/src/main/assets/semantic/e5_model_int8.onnx app/src/main/assets/semantic/e5_vocab.tsv
          git commit -m "Moteur sémantique : multilingual-e5-small (remplace MiniLM)"
          git push
